name: Build My OpenWrt

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild even if upstream tag is unchanged"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'config/my-config.txt'
      - '.github/workflows/build.yml'
      - 'extra-files/**'
  schedule:
    - cron: "23 3 * * *"

concurrency:
  group: openwrt-build
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load my config
        id: cfg
        run: |
          set -a
          source config/my-config.txt
          set +a
          {
            echo "openwrt_ip=${OPENWRT_IP}"
            echo "openwrt_board=${OPENWRT_BOARD}"
            echo "openwrt_kernel=${OPENWRT_KERNEL}"
            echo "auto_kernel=${AUTO_KERNEL}"
            echo "builder_name=${BUILDER_NAME}"
            echo "source_branch=${SOURCE_BRANCH}"
            echo "add_argon=${ADD_ARGON:-true}"
            echo "add_tempinfo=${ADD_TEMPINFO:-true}"
          } >> "$GITHUB_OUTPUT"
          echo "### My config:"
          cat config/my-config.txt

      - name: Detect upstream latest rootfs
        id: detect
        run: |
          BRANCH="${{ steps.cfg.outputs.source_branch }}"
          PREFIX="OpenWrt_${BRANCH}_"

          TAG=$(curl -fsSL "https://github.com/ophub/amlogic-s9xxx-openwrt/releases.atom" \
                | grep -oP "(?<=<title>)${PREFIX}[^<]+" \
                | head -n1)

          if [[ -z "${TAG}" ]]; then
            echo "::error::No release tag found for prefix ${PREFIX}"
            exit 1
          fi
          echo "Upstream latest tag: ${TAG}"

          ASSET=$(curl -fsSL "https://github.com/ophub/amlogic-s9xxx-openwrt/releases/expanded_assets/${TAG}" \
                  | grep -oP 'releases/download/[^"]+-rootfs\.tar\.gz' \
                  | head -n1)

          if [[ -z "${ASSET}" ]]; then
            echo "::error::No rootfs asset found in tag ${TAG}"
            exit 1
          fi

          URL="https://github.com/ophub/amlogic-s9xxx-openwrt/${ASSET}"
          echo "Rootfs URL: ${URL}"

          {
            echo "rootfs_url=${URL}"
            echo "upstream_tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Detect latest Argon theme release
        id: argon
        run: |
          if [[ "${{ steps.cfg.outputs.add_argon }}" != "true" ]]; then
            echo "Argon theme disabled by config."
            {
              echo "argon_tag=none"
              echo "theme_url="
              echo "i18n_url="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG=$(curl -fsSL "https://github.com/jerrykuku/luci-theme-argon/releases.atom" \
                | grep -oP '(?<=<title>)v\d+\.\d+\.\d+(?=<)' \
                | head -n1)

          if [[ -z "${TAG}" ]]; then
            echo "::error::No Argon release tag found"
            exit 1
          fi
          echo "Argon latest tag: ${TAG}"

          ASSETS=$(curl -fsSL "https://github.com/jerrykuku/luci-theme-argon/releases/expanded_assets/${TAG}")

          THEME=$(echo "${ASSETS}" | grep -oP 'releases/download/[^"]+/luci-theme-argon_[^"]+\.ipk' | head -n1)
          I18N=$(echo "${ASSETS}" | grep -oP 'releases/download/[^"]+/luci-i18n-argon-config-zh-cn_[^"]+\.ipk' | head -n1)

          if [[ -z "${THEME}" ]]; then
            echo "::error::No Argon theme ipk found in ${TAG}"
            exit 1
          fi

          echo "Theme URL: https://github.com/jerrykuku/luci-theme-argon/${THEME}"
          echo "i18n  URL: https://github.com/jerrykuku/luci-theme-argon/${I18N}"

          {
            echo "argon_tag=${TAG}"
            echo "theme_url=https://github.com/jerrykuku/luci-theme-argon/${THEME}"
            echo "i18n_url=https://github.com/jerrykuku/luci-theme-argon/${I18N}"
          } >> "$GITHUB_OUTPUT"

      - name: Check if rebuild needed
        id: check
        run: |
          TAG="${{ steps.detect.outputs.upstream_tag }}"
          ARGON="${{ steps.argon.outputs.argon_tag }}"
          FORCE="${{ inputs.force || false }}"
          BUILDER="${{ steps.cfg.outputs.builder_name }}"
          IP="${{ steps.cfg.outputs.openwrt_ip }}"
          BOARD="${{ steps.cfg.outputs.openwrt_board }}"
          KERNEL="${{ steps.cfg.outputs.openwrt_kernel }}"

          # Hash the custom overlay files so that editing extra-files/ triggers a rebuild
          EXTRA_HASH=""
          if [[ -d extra-files ]]; then
            EXTRA_HASH=$(find extra-files -type f -exec sha256sum {} \; | sort | sha256sum | cut -c1-16)
          else
            EXTRA_HASH="none"
          fi
          
          FINGERPRINT="${TAG}|${ARGON}|${BUILDER}|${IP}|${BOARD}|${KERNEL}|${EXTRA_HASH}"

          PREV=""
          if [[ -f .build-state ]]; then
            PREV=$(cat .build-state | tr -d '\n')
          fi

          echo "Previous fingerprint: ${PREV:-<none>}"
          echo "Current  fingerprint: ${FINGERPRINT}"

          if [[ "${FORCE}" == "true" ]]; then
            echo "FORCE=true -> rebuild anyway."
            echo "need_build=true" >> "$GITHUB_OUTPUT"
          elif [[ "${PREV}" == "${FINGERPRINT}" ]]; then
            echo "Upstream tag, Argon tag and config unchanged -> skip rebuild."
            echo "need_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected -> rebuild."
            echo "need_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Argon theme files
        if: steps.check.outputs.need_build == 'true' && steps.cfg.outputs.add_argon == 'true'
        run: |
          set -e
          rm -rf argon-files work
          mkdir -p argon-files work

          for url in "${{ steps.argon.outputs.theme_url }}" "${{ steps.argon.outputs.i18n_url }}"; do
            if [[ -z "${url}" ]]; then
              continue
            fi
            name="$(basename "${url}")"
            echo "Downloading ${name}"
            curl -fsSL "${url}" -o "work/${name}"
            mkdir -p "work/x_${name}"
            tar -xzf "work/${name}" -C "work/x_${name}"
            tar -xzf "work/x_${name}/data.tar.gz" -C argon-files
          done

          rm -rf work

          # rpcd scripts must stay executable
          chmod 0755 argon-files/usr/libexec/rpcd/luci.argon* 2>/dev/null || true

          echo "Argon static files:"
          ls argon-files/www/luci-static/argon/ | head
          echo "Argon ucode templates:"
          ls argon-files/usr/share/ucode/luci/template/themes/argon/
          echo "Argon uci-defaults:"
          ls argon-files/etc/uci-defaults/

      - name: Prepare custom overlay files
        if: steps.check.outputs.need_build == 'true'
        run: |
          set -e
          rm -rf overlay-files
          mkdir -p overlay-files

          # Temperature display: /sbin/tempinfo + rpcd ACL
          if [[ "${{ steps.cfg.outputs.add_tempinfo }}" == "true" ]]; then
            echo "Adding temperature display files..."
            mkdir -p overlay-files/sbin overlay-files/usr/share/rpcd/acl.d
            cp extra-files/sbin/tempinfo overlay-files/sbin/tempinfo
            cp extra-files/usr/share/rpcd/acl.d/luci-status-extra.json \
               overlay-files/usr/share/rpcd/acl.d/luci-status-extra.json
            chmod 0755 overlay-files/sbin/tempinfo
            chmod 0644 overlay-files/usr/share/rpcd/acl.d/luci-status-extra.json
            echo "  overlay-files/sbin/tempinfo"
            echo "  overlay-files/usr/share/rpcd/acl.d/luci-status-extra.json"
          fi

          # Merge any other files under extra-files/
          if [[ -d extra-files ]]; then
            find extra-files -type f | while read -r f; do
              rel="${f#extra-files/}"
              case "${rel}" in
                sbin/tempinfo|usr/share/rpcd/acl.d/luci-status-extra.json)
                  continue ;;
              esac
              mkdir -p "overlay-files/$(dirname "${rel}")"
              cp "${f}" "overlay-files/${rel}"
              echo "  extra-files/${rel}"
            done
          fi

          echo "Overlay tree:"
          find overlay-files -type f | sort

          # Normalize line endings: shell scripts must use LF, CRLF breaks them
          echo "Normalizing line endings..."
          find overlay-files -type f -name '*.sh' -o -type f -path '*/sbin/*' | while read -r f; do
            if file "$f" | grep -q 'CRLF'; then
              echo "  converting CRLF -> LF: ${f}"
              sed -i 's/\r$//' "$f"
            fi
          done

          if [[ -f overlay-files/sbin/tempinfo ]]; then
            chmod 0755 overlay-files/sbin/tempinfo
            head -1 overlay-files/sbin/tempinfo
          fi

      - name: Package OpenWrt for target boards
        if: steps.check.outputs.need_build == 'true'
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: ${{ steps.detect.outputs.rootfs_url }}
          openwrt_board: ${{ steps.cfg.outputs.openwrt_board }}
          openwrt_kernel: ${{ steps.cfg.outputs.openwrt_kernel }}
          auto_kernel: ${{ steps.cfg.outputs.auto_kernel }}
          openwrt_ip: ${{ steps.cfg.outputs.openwrt_ip }}
          builder_name: ${{ steps.cfg.outputs.builder_name }}
          openwrt_files: overlay-files

      - name: Upload packaged OpenWrt to Release
        if: steps.check.outputs.need_build == 'true' && env.PACKAGED_STATUS == 'success'
        uses: ophub/upload-to-releases@main
        with:
          tag: ${{ steps.cfg.outputs.builder_name }}_${{ steps.detect.outputs.upstream_tag }}
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### My Custom OpenWrt
            - Upstream: `${{ steps.detect.outputs.upstream_tag }}`
            - Argon: `${{ steps.argon.outputs.argon_tag }}`
            - IP: `${{ steps.cfg.outputs.openwrt_ip }}`
            - Board: `${{ steps.cfg.outputs.openwrt_board }}`
            - Kernel: `${{ steps.cfg.outputs.openwrt_kernel }}`
            - Builder: `${{ steps.cfg.outputs.builder_name }}`

      - name: Save build state
        if: steps.check.outputs.need_build == 'true' && env.PACKAGED_STATUS == 'success'
        run: |
          TAG="${{ steps.detect.outputs.upstream_tag }}"
          ARGON="${{ steps.argon.outputs.argon_tag }}"
          BUILDER="${{ steps.cfg.outputs.builder_name }}"
          IP="${{ steps.cfg.outputs.openwrt_ip }}"
          BOARD="${{ steps.cfg.outputs.openwrt_board }}"
          KERNEL="${{ steps.cfg.outputs.openwrt_kernel }}"
          EXTRA_HASH=""
          if [[ -d extra-files ]]; then
            EXTRA_HASH=$(find extra-files -type f -exec sha256sum {} \; | sort | sha256sum | cut -c1-16)
          else
            EXTRA_HASH="none"
          fi
          printf '%s|%s|%s|%s|%s|%s|%s\n' "$TAG" "$ARGON" "$BUILDER" "$IP" "$BOARD" "$KERNEL" "$EXTRA_HASH" > .build-state
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-state
          git commit -m "chore: update build state [${TAG} / ${ARGON}]" || echo "Nothing to commit."
          git push origin HEAD:main

      - name: Build summary
        if: always()
        run: |
          {
            echo "### Build Summary"
            echo ""
            echo "- Upstream tag: \`${{ steps.detect.outputs.upstream_tag }}\`"
            echo "- Argon tag: \`${{ steps.argon.outputs.argon_tag }}\`"
            echo "- Need build: \`${{ steps.check.outputs.need_build || 'false' }}\`"
            echo "- Status: \`${{ env.PACKAGED_STATUS || 'skipped' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
